<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Biblioteca de juegos</title>
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <div class="container">
    <header>
      <section class="hero">
        <span class="eyebrow">Proyecto personal</span>
        <h1>Biblioteca de juegos</h1>
        <p>
          Explora tu colección por plataforma, consulta notas y revisa el estado de prueba de cada título.
        </p>
        <div class="hero-summary" aria-label="Resumen de la colección">
          <span id="hero-game-count">0 juegos</span>
          <span class="summary-separator">·</span>
          <span>11 plataformas</span>
        </div>
      </section>
    </header>

    <main>
      <section class="toolbar">
        <div class="search-box">
          <input
            id="search-input"
            type="search"
            placeholder="Buscar por título o notas..."
            aria-label="Buscar por título o notas"
          />
        </div>

        <div class="filters" aria-label="Filtros por plataforma">
          <button class="filter-btn filter-card active" data-platform="todos">
            <span class="filter-icon">
              <img src="assets/img/platforms/all.svg" alt="" aria-hidden="true" />
            </span>
            <span>Todos</span>
          </button>

          <button class="filter-btn filter-card" data-platform="PC">
            <span class="filter-icon">
              <img src="assets/img/platforms/pc.png" alt="" aria-hidden="true" />
            </span>
            <span>PC</span>
          </button>

          <button class="filter-btn filter-card" data-platform="PS1">
            <span class="filter-icon">
              <img src="assets/img/platforms/ps1.png" alt="" aria-hidden="true" />
            </span>
            <span>PS1</span>
          </button>

          <button class="filter-btn filter-card"data-platform="PS2">
            <span class="filter-icon">
              <img src="assets/img/platforms/ps2.png" alt="" aria-hidden="true" />
            </span>
            <span>PS2</span>
          </button>

          <button class="filter-btn filter-card" data-platform="PS3">
            <span class="filter-icon">
              <img src="assets/img/platforms/ps3.png" alt="" aria-hidden="true" />
            </span>
            <span>PS3</span>
          </button>

          <button class="filter-btn filter-card"data-platform="PS4">
            <span class="filter-icon">
              <img src="assets/img/platforms/ps4.png" alt="" aria-hidden="true" />
            </span>
            <span>PS4</span>
          </button>
          
          <button class="filter-btn filter-card" data-platform="PSP">
            <span class="filter-icon">
              <img src="assets/img/platforms/psp.png" alt="" aria-hidden="true" />
            </span>
            <span>PSP</span>
          </button>

          <button class="filter-btn filter-card" data-platform="GameBoy">
            <span class="filter-icon">
              <img src="assets/img/platforms/gameboy.png" alt="" aria-hidden="true" />
            </span>
            <span>GameBoy</span>
          </button>

          <button class="filter-btn filter-card" data-platform="GameCube">
            <span class="filter-icon">
              <img src="assets/img/platforms/gamecube.png" alt="" aria-hidden="true" />
            </span>
            <span>GameCube</span>
          </button>

          <button class="filter-btn filter-card" data-platform="DS">
            <span class="filter-icon">
              <img src="assets/img/platforms/ds.png" alt="" aria-hidden="true" />
            </span>
            <span>DS</span>
          </button>

          <button class="filter-btn filter-card" data-platform="3DS">
            <span class="filter-icon">
              <img src="assets/img/platforms/3ds.png" alt="" aria-hidden="true" />
            </span>
            <span>3DS</span>
          </button>

          <button class="filter-btn filter-card" data-platform="Wii">
            <span class="filter-icon">
              <img src="assets/img/platforms/wii.png" alt="" aria-hidden="true" />
            </span>
            <span>Wii</span>
          </button>
        </div>
      </section>

      <section class="stats">
        <article class="stat-card">
          <div class="stat-label">Juegos catalogados</div>
          <div class="stat-value" id="stat-games">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Dumps correctos</div>
          <div class="stat-value" id="stat-dumps-ok">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Estados pendientes o fallidos</div>
          <div class="stat-value" id="stat-dumps-pending">0</div>
        </article>
        <article class="stat-card">
          <div class="stat-label">Plataformas visibles</div>
          <div class="stat-value" id="stat-platforms">0</div>
        </article>
      </section>

      <section>
        <h2 class="section-title">Juegos de ejemplo</h2>
        <div class="grid" id="games-grid">
          <!-- Las tarjetas se generan con JS -->
        </div>
      </section>
    </main>

  </div>
<script src="assets/js/catalogo.js"></script>
<script src="assets/js/ui.js"></script>
</body>
</html>
